name: Build External Injector IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.2'

      - name: Build Unsigned App
        run: |
          echo "Compilando FreeFire External Injector..."
          mkdir -p build/Payload/FreeFireInjector.app
          
          # Compilar código fonte Objective-C / C++ com caminho correto
          xcrun -sdk iphoneos clang++ -arch arm64 -std=c++17 -fobjc-arc \
            Kernel/ExternalPatcher.mm \
            -framework Foundation -framework UIKit \
            -c -o build/ExternalPatcher.o

          echo "Build concluído com sucesso!"
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: External-Injector-IPA
          path: build/
