name: Build Unsigned IPA Variants

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Aimbot-Holograma
            condition: ""
          - name: Cache
            condition: CACHE_VARIANT

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build unsigned ${{ matrix.name }} IPA
        env:
          VARIANT: ${{ matrix.name }}
          SWIFT_CONDITION: ${{ matrix.condition }}
        run: |
          set -euo pipefail
          OUT="build/${VARIANT}"
          xcodebuild build \
            -project ThreeOneOSFive.xcodeproj \
            -target 3105 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "${OUT}/DerivedData" \
            CONFIGURATION_BUILD_DIR="${PWD}/${OUT}" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="${SWIFT_CONDITION}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

          test -d "${OUT}/3105.app"
          mkdir -p "${OUT}/Payload"
          ditto "${OUT}/3105.app" "${OUT}/Payload/3105.app"
          (cd "${OUT}" && zip -qr "../MenagerFF_${VARIANT}_Unsigned.ipa" Payload)
          test -s "build/MenagerFF_${VARIANT}_Unsigned.ipa"

      - name: Upload ${{ matrix.name }} IPA
        uses: actions/upload-artifact@v4
        with:
          name: MenagerFF-${{ matrix.name }}-Unsigned-IPA
          path: build/MenagerFF_${{ matrix.name }}_Unsigned.ipa
          if-no-files-found: error
          retention-days: 14
