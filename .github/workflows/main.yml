name: Build External Injector IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.2'

      - name: Build Unsigned App
        run: |
          echo "Compilando FreeFire External Injector..."
          mkdir -p build/Payload/FFInjector.app
          
          # Compilar o binário principal do App (ExternalPatcher agora atua como entry point)
          xcrun -sdk iphoneos clang++ -arch arm64 -std=c++17 -fobjc-arc \
            Kernel/ExternalPatcher.mm \
            -framework Foundation -framework UIKit \
            -o build/Payload/FFInjector.app/FFInjector
          
          # Criar Info.plist básico
          cat <<EOF > build/Payload/FFInjector.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>FFInjector</string>
              <key>CFBundleIdentifier</key>
              <string>com.auth.FFInjector</string>
              <key>CFBundleName</key>
              <string>FFInjector</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
              <key>UILaunchStoryboardName</key>
              <string>LaunchScreen</string>
          </dict>
          </plist>
          EOF

          # Empacotar como IPA
          cd build && zip -r ../FreeFireInjector.ipa Payload
          echo "Build da IPA concluído com sucesso!"
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: External-Injector-IPA
          path: FreeFireInjector.ipa
