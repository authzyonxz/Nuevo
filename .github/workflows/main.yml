name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build unsigned iOS app
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build
          mkdir -p build

          xcodebuild build \
            -project ThreeOneOSFive.xcodeproj \
            -alltargets \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO

          app_path="$(find "$GITHUB_WORKSPACE/build/DerivedData/Build/Products" \
            -maxdepth 2 -type d -name '*.app' -print -quit)"

          if [[ -z "$app_path" ]]; then
            echo "Nenhum .app foi encontrado após o build."
            exit 1
          fi

          echo "App encontrado em: $app_path"
          mkdir -p build/Payload
          cp -R "$app_path" build/Payload/

          cd build
          /usr/bin/zip -qry MenagerFF_unsigned.ipa Payload
          test -s MenagerFF_unsigned.ipa
          echo "IPA criado: $(pwd)/MenagerFF_unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: MenagerFF_unsigned_IPA
          path: build/MenagerFF_unsigned.ipa
          if-no-files-found: error
          retention-days: 14
