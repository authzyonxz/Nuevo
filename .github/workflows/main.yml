name: Build 3105 unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    name: Build 3105 unsigned IPA
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show build environment
        run: xcodebuild -version

      - name: Build unsigned app
        run: |
          set -euo pipefail
          rm -rf build/Unsigned
          mkdir -p build/Unsigned/Release-iphoneos
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -target 3105 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CONFIGURATION_BUILD_DIR="$PWD/build/Unsigned/Release-iphoneos" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            SWIFT_OPTIMIZATION_LEVEL=-O \
            SWIFT_COMPILATION_MODE=wholemodule \
            DEAD_CODE_STRIPPING=YES \
            STRIP_INSTALLED_PRODUCT=YES \
            COPY_PHASE_STRIP=YES \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="build/Unsigned/Release-iphoneos/3105.app"
          test -d "$APP_PATH"
          rm -rf build/Unsigned/Payload
          mkdir -p build/Unsigned/Payload
          cp -R "$APP_PATH" build/Unsigned/Payload/3105.app
          (
            cd build/Unsigned
            /usr/bin/zip -qry 3105-unsigned.ipa Payload
          )
          test -s build/Unsigned/3105-unsigned.ipa

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3105-unsigned-ipa
          path: build/Unsigned/3105-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
