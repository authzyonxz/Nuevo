name: Build Unsigned IPA Variants

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Aimbot-Holograma
            condition: ""
          - name: Cache
            condition: CACHE_VARIANT

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show build environment
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Build unsigned ${{ matrix.name }} IPA
        env:
          VARIANT: ${{ matrix.name }}
          SWIFT_CONDITION: ${{ matrix.condition }}
        run: |
          set -euo pipefail
          rm -rf "build/${VARIANT}"
          mkdir -p "build/${VARIANT}/Release-iphoneos"
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -target 3105 \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$PWD/build/${VARIANT}/Release-iphoneos" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="${SWIFT_CONDITION}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            SWIFT_OPTIMIZATION_LEVEL=-O \
            SWIFT_COMPILATION_MODE=wholemodule \
            DEAD_CODE_STRIPPING=YES \
            STRIP_INSTALLED_PRODUCT=YES \
            COPY_PHASE_STRIP=YES \
            build

      - name: Package unsigned ${{ matrix.name }} IPA
        env:
          VARIANT: ${{ matrix.name }}
        run: |
          set -euo pipefail
          APP_PATH="build/${VARIANT}/Release-iphoneos/3105.app"
          test -d "$APP_PATH"
          mkdir -p "build/${VARIANT}/Payload"
          cp -R "$APP_PATH" "build/${VARIANT}/Payload/3105.app"
          (
            cd "build/${VARIANT}"
            /usr/bin/zip -qry "../MenagerFF_${VARIANT}_Unsigned.ipa" Payload
          )
          test -s "build/${VARIANT}/MenagerFF_${VARIANT}_Unsigned.ipa"

      - name: Upload ${{ matrix.name }} IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MenagerFF-${{ matrix.name }}-Unsigned-IPA
          path: build/${{ matrix.name }}/MenagerFF_${{ matrix.name }}_Unsigned.ipa
          if-no-files-found: error
          retention-days: 14
