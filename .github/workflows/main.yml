name: Build Unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build Unsigned IPA
        run: |
          # Garantir que o esquema MenagerFF seja reconhecido usando -alltargets se necessário, 
          # mas o ideal é o nome do target que agora é MenagerFF
          xcodebuild build \
            -project ThreeOneOSFive.xcodeproj \
            -target MenagerFF \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES
          
          mkdir -p build/Payload
          # O xcodebuild build coloca o app em build/Build/Products/Release-iphoneos/
          cp -r build/Build/Products/Release-iphoneos/MenagerFF.app build/Payload/
          cd build
          zip -r MenagerFF_V27_Rev7.ipa Payload
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MenagerFF_V27_IPA
          path: build/MenagerFF_V27_Rev7.ipa
