name: Build Unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build app without code signing
        run: |
          set -euo pipefail
          rm -rf build
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          products_dir="build/DerivedData/Build/Products/Release-iphoneos"
          app_path="$(find "$products_dir" -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [ -z "$app_path" ]; then
            echo "No .app product found in $products_dir" >&2
            exit 1
          fi

          rm -rf build/Payload build/MenagerFF_Unsigned.ipa
          mkdir -p build/Payload
          cp -R "$app_path" build/Payload/
          (cd build && /usr/bin/zip -qry MenagerFF_Unsigned.ipa Payload)

          test -s build/MenagerFF_Unsigned.ipa
          unzip -l build/MenagerFF_Unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: MenagerFF_Unsigned_IPA
          path: build/MenagerFF_Unsigned.ipa
          if-no-files-found: error
