name: Build Unified Unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    name: Build MenagerFF Unified
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show build environment
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Build unified unsigned IPA
        run: |
          set -euo pipefail
          rm -rf build/Unified
          mkdir -p build/Unified/Release-iphoneos
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -target 3105 \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$PWD/build/Unified/Release-iphoneos" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            SWIFT_OPTIMIZATION_LEVEL=-O \
            SWIFT_COMPILATION_MODE=wholemodule \
            DEAD_CODE_STRIPPING=YES \
            STRIP_INSTALLED_PRODUCT=YES \
            COPY_PHASE_STRIP=YES \
            build

      - name: Package unified unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="build/Unified/Release-iphoneos/3105.app"
          test -d "$APP_PATH"
          mkdir -p build/Unified/Payload
          cp -R "$APP_PATH" build/Unified/Payload/3105.app
          (
            cd build/Unified
            /usr/bin/zip -qry MenagerFF_Unified_Unsigned.ipa Payload
          )
          test -s build/Unified/MenagerFF_Unified_Unsigned.ipa

      - name: Upload unified IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MenagerFF-Unified-Unsigned-IPA
          path: build/Unified/MenagerFF_Unified_Unsigned.ipa
          if-no-files-found: error
          retention-days: 14
