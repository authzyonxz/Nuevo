name: Build Unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build unsigned app
        run: |
          xcodebuild build \
            -project ThreeOneOSFive.xcodeproj \
            -alltargets \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          rm -rf build
          mkdir -p build/Payload
          find . -name "*.app" -type d -path "*/Build/Products/*iphoneos/*" -exec cp -R {} build/Payload/ \;
          test -n "$(find build/Payload -maxdepth 1 -name '*.app' -type d -print -quit)"
          cd build
          zip -qry MenagerFF-avatar-payloads-v3-unsigned.ipa Payload
          shasum -a 256 MenagerFF-avatar-payloads-v3-unsigned.ipa > MenagerFF-avatar-payloads-v3-unsigned.ipa.sha256

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: MenagerFF-avatar-payloads-v3-unsigned
          path: |
            build/MenagerFF-avatar-payloads-v3-unsigned.ipa
            build/MenagerFF-avatar-payloads-v3-unsigned.ipa.sha256
