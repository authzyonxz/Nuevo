name: Build unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build app without code signing
        run: |
          set -o pipefail
          rm -rf build Payload 3105-unsigned.ipa
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build | tee build.log

          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d | head -1)"
          test -n "$APP_PATH"
          test -f "$APP_PATH/Info.plist"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/3105.app
          /usr/bin/zip -qry 3105-unsigned.ipa Payload

      - name: Upload unsigned IPA and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 3105-unsigned-ipa
          path: |
            3105-unsigned.ipa
            build.log
          if-no-files-found: warn
          retention-days: 14
