name: Build 3105 unsigned

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Selecionar Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Compilar unsigned
        run: |
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Empacotar IPA unsigned
        run: |
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/3105.app build/Payload/3105.app
          ditto -c -k --sequesterRsrc --keepParent build/Payload build/3105-unsigned.zip

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: 3105-unsigned
          path: build/3105-unsigned.zip
