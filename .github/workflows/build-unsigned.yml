name: Build Unsigned IPA

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.2'

    - name: Build Project Unsigned IPA
      run: |
        set -e
        echo "Cleaning and building..."
        xcodebuild -project ThreeOneOSFive.xcodeproj -scheme ThreeOneOSFive -configuration Release -sdk iphoneos CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO clean build
        
        echo "Creating Payload directory..."
        mkdir -p Payload
        cp -r build/DerivedData/Build/Products/Release-iphoneos/3105.app Payload/
        
        echo "Zipping to IPA..."
        zip -r 3105-unsigned.ipa Payload
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: 3105-unsigned
        path: 3105-unsigned.ipa
