name: Build 3105 Unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-3105-ipa:
    name: Build 3105 IPA
    runs-on: macos-latest

    steps:
      - name: Checkout 3105 project
        uses: actions/checkout@v4

      - name: Set up latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show build environment
        run: |
          set -euo pipefail
          xcodebuild -version
          xcode-select -p

      - name: Build unsigned iPhoneOS app
        run: |
          set -euo pipefail
          rm -rf build/3105
          mkdir -p build/3105/Release-iphoneos
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -target 3105 \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$PWD/build/3105/Release-iphoneos" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            SWIFT_OPTIMIZATION_LEVEL=-O \
            SWIFT_COMPILATION_MODE=wholemodule \
            DEAD_CODE_STRIPPING=YES \
            STRIP_INSTALLED_PRODUCT=YES \
            COPY_PHASE_STRIP=YES \
            build

      - name: Package signer-friendly unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="build/3105/Release-iphoneos/3105.app"
          test -d "$APP_PATH"
          test -x "$APP_PATH/3105"
          test -f "$APP_PATH/Info.plist"
          xattr -cr "$APP_PATH" || true
          rm -rf "$APP_PATH/_CodeSignature"
          find "$APP_PATH" -name '*.mobileprovision' -delete
          rm -rf build/3105/Payload
          mkdir -p build/3105/Payload
          cp -R "$APP_PATH" build/3105/Payload/3105.app
          cd build/3105
          rm -f 3105_Unsigned.ipa
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload 3105_Unsigned.ipa
          test -s 3105_Unsigned.ipa
          unzip -t 3105_Unsigned.ipa

      - name: Upload 3105 IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3105-Unsigned-IPA
          path: build/3105/3105_Unsigned.ipa
          if-no-files-found: error
          retention-days: 14
