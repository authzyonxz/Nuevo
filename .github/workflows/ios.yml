name: Build MenagerFF KeyOnly IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.2.app
          xcodebuild -version

      - name: Create Complete XPC Stub for Compilation
        run: |
          cd source
          mkdir -p xpc
          cat <<EOF > xpc/xpc.h
          #ifndef XPC_XPC_H
          #define XPC_XPC_H
          #include <stdint.h>
          #include <stdbool.h>
          #include <stddef.h>

          typedef void* xpc_object_t;
          typedef void* xpc_connection_t;
          typedef void* xpc_type_t;
          typedef void (^xpc_handler_t)(xpc_object_t object);

          #define XPC_TYPE_DICTIONARY ((xpc_type_t)0)
          #define XPC_TYPE_ARRAY ((xpc_type_t)0)
          #define XPC_TYPE_STRING ((xpc_type_t)0)
          #define XPC_TYPE_INT64 ((xpc_type_t)0)

          #ifdef __cplusplus
          extern "C" {
          #endif

          xpc_object_t xpc_dictionary_create(const char *const *keys, xpc_object_t *values, size_t count);
          void xpc_release(xpc_object_t object);
          xpc_object_t xpc_string_create(const char *string);

          #ifdef __cplusplus
          }
          #endif

          #endif
          EOF

      - name: Build Xcode Project (Unsigned)
        run: |
          cd source
          SCHEME_NAME=$(xcodebuild -list -project ThreeOneOSFive.xcodeproj | grep -A 20 "Schemes:" | tail -n +2 | head -n 1 | xargs)
          if [ -z "$SCHEME_NAME" ]; then
            SCHEME_NAME="ThreeOneOSFive"
          fi
          echo "Usando Scheme: $SCHEME_NAME"
          
          SDK_PATH=$(xcrun -sdk iphoneos --show-sdk-path)
          
          xcodebuild -project ThreeOneOSFive.xcodeproj \
            -scheme "$SCHEME_NAME" \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            OTHER_CFLAGS="-isysroot $SDK_PATH -I$(pwd)" \
            build

      - name: Package IPA
        run: |
          cd source
          SCHEME_NAME=$(xcodebuild -list -project ThreeOneOSFive.xcodeproj | grep -A 20 "Schemes:" | tail -n +2 | head -n 1 | xargs)
          if [ -z "$SCHEME_NAME" ]; then
            SCHEME_NAME="ThreeOneOSFive"
          fi
          
          BUILD_DIR=$(xcodebuild -project ThreeOneOSFive.xcodeproj -scheme "$SCHEME_NAME" -sdk iphoneos -showBuildSettings | grep -m 1 "BUILT_PRODUCTS_DIR =" | awk -F ' = ' '{print $2}')
          echo "Build dir: $BUILD_DIR"
          
          APP_PATH=$(find "$BUILD_DIR" -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" | head -n 1)
          fi
          
          echo "App path: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          
          zip -r ../MenagerFF_KeyOnly.ipa Payload
          cd ..
          ls -lh MenagerFF_KeyOnly.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MenagerFF-KeyOnly-IPA
          path: MenagerFF_KeyOnly.ipa
