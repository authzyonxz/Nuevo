name: Build MenagerFF KeyOnly IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.2.app
          xcodebuild -version

      - name: Build Xcode Project (Unsigned)
        run: |
          cd source
          xcodebuild -project ThreeOneOSFive.xcodeproj \
            -scheme ThreeOneOSFive \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          cd source
          # Localizar o build app gerado pelo xcodebuild
          BUILD_DIR=$(xcodebuild -project ThreeOneOSFive.xcodeproj -scheme ThreeOneOSFive -sdk iphoneos -showBuildSettings | grep -m 1 "BUILT_PRODUCTS_DIR =" | awk -F ' = ' '{print $2}')
          echo "Build dir: $BUILD_DIR"
          
          APP_PATH="$BUILD_DIR/ThreeOneOSFive.app"
          if [ ! -d "$APP_PATH" ]; then
            # Fallback para derived data padrão
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "ThreeOneOSFive.app" | head -n 1)
          fi
          
          echo "App path: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          
          zip -r ../MenagerFF_KeyOnly.ipa Payload
          cd ..
          ls -lh MenagerFF_KeyOnly.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MenagerFF-KeyOnly-IPA
          path: MenagerFF_KeyOnly.ipa
